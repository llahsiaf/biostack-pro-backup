name: Build iOS IPA (Sideloadly Ready)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Verify Source
        run: |
          npm run audit-syntax
          npm run verify-phase10

      - name: Generate iOS Native Project
        run: npx expo prebuild --platform ios --clean --non-interactive

      - name: Verify iOS Project
        shell: bash
        run: |
          set -euo pipefail

          WORKSPACE="$(find ios -maxdepth 1 -type d -name '*.xcworkspace' -print -quit)"
          if [[ -z "$WORKSPACE" ]]; then
            echo "::error::No .xcworkspace was generated under ios/"
            exit 1
          fi

          echo "Workspace: $WORKSPACE"
          xcodebuild -list -workspace "$WORKSPACE"

      - name: Resolve Xcode Scheme
        id: xcode
        shell: bash
        run: |
          set -euo pipefail

          WORKSPACE="$(find ios -maxdepth 1 -type d -name '*.xcworkspace' -print -quit)"
          SCHEME="$(
            xcodebuild -list -json -workspace "$WORKSPACE" |
            python3 -c 'import json,sys; d=json.load(sys.stdin); schemes=d["workspace"]["schemes"]; print(schemes[0] if schemes else "")'
          )"

          if [[ -z "$SCHEME" ]]; then
            echo "::error::No Xcode scheme was found."
            exit 1
          fi

          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "Resolved scheme: $SCHEME"

      - name: Compile Unsigned iOS App
        shell: bash
        run: |
          set -o pipefail

          mkdir -p dist

          xcodebuild \
            -workspace "${{ steps.xcode.outputs.workspace }}" \
            -scheme "${{ steps.xcode.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee dist/xcodebuild.log

      - name: Package Unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="$(find ios/build/Build/Products/Release-iphoneos -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [[ -z "$APP_PATH" ]]; then
            echo "::error::No Release .app was produced."
            exit 1
          fi

          rm -rf dist/Payload
          mkdir -p dist/Payload
          cp -R "$APP_PATH" dist/Payload/

          (
            cd dist
            zip -r -q BioStack_PRO_iOS_unsigned.ipa Payload
          )

          rm -rf dist/Payload

          echo "IPA created:"
          ls -lh dist/BioStack_PRO_iOS_unsigned.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BioStack-PRO-Sideloadly-${{ github.sha }}
          path: |
            dist/BioStack_PRO_iOS_unsigned.ipa
            dist/xcodebuild.log
          retention-days: 7

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: BioStack-PRO-build-failure-${{ github.run_id }}
          path: |
            dist/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
