name: Build iOS IPA (Sideloadly Ready)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      # ==========================================
      # CHECKOUT
      # ==========================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ==========================================
      # SETUP NODE
      # ==========================================
      # Tidak menggunakan cache npm agar setup-node
      # tidak gagal mencari lockfile sebelum npm ci.
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ==========================================
      # VERIFY PROJECT FILES
      # ==========================================
      - name: Verify Project Files
        shell: bash
        run: |
          set -euo pipefail

          echo "Working directory:"
          pwd

          echo ""
          echo "Repository root:"
          git rev-parse --show-toplevel

          echo ""
          echo "Project files:"
          ls -la

          test -f package.json || {
            echo "::error::package.json not found"
            exit 1
          }

          test -f package-lock.json || {
            echo "::error::package-lock.json not found"
            exit 1
          }

          echo ""
          echo "✓ package.json found"
          echo "✓ package-lock.json found"

      # ==========================================
      # INSTALL DEPENDENCIES
      # ==========================================
      - name: Install Dependencies
        run: npm ci

      # ==========================================
      # VERIFY SOURCE
      # ==========================================
      - name: Verify Source
        run: |
          npm run audit-syntax
          npm run verify-phase10
          npm run verify-phase10-1

      # ==========================================
      # GENERATE NATIVE IOS PROJECT
      # ==========================================
      - name: Generate iOS Native Project
        run: |
          npx expo prebuild \
            --platform ios \
            --clean \
            --non-interactive

      # ==========================================
      # VERIFY IOS PROJECT
      # ==========================================
      - name: Verify iOS Project
        shell: bash
        run: |
          set -euo pipefail

          echo "Contents of ios/:"
          ls -la ios

          WORKSPACE="$(find ios -maxdepth 1 -type d -name '*.xcworkspace' -print -quit)"

          if [[ -z "$WORKSPACE" ]]; then
            echo "::error::No .xcworkspace was generated under ios/"
            exit 1
          fi

          echo ""
          echo "✓ Workspace found:"
          echo "$WORKSPACE"

          echo ""
          echo "Available Xcode configuration:"
          xcodebuild -list -workspace "$WORKSPACE"

      # ==========================================
      # RESOLVE XCODE SCHEME
      # ==========================================
      - name: Resolve Xcode Scheme
        id: xcode
        shell: bash
        run: |
          set -euo pipefail

          WORKSPACE="$(find ios -maxdepth 1 -type d -name '*.xcworkspace' -print -quit)"

          if [[ -z "$WORKSPACE" ]]; then
            echo "::error::No Xcode workspace found."
            exit 1
          fi

          SCHEME="$(
            xcodebuild -list -json -workspace "$WORKSPACE" |
            python3 -c '
import json
import sys

data = json.load(sys.stdin)
schemes = data.get("workspace", {}).get("schemes", [])

preferred = [
    s for s in schemes
    if s.lower() == "biostackpro"
]

if preferred:
    print(preferred[0])
elif schemes:
    print(schemes[0])
else:
    print("")
'
          )"

          if [[ -z "$SCHEME" ]]; then
            echo "::error::No Xcode scheme was found."
            exit 1
          fi

          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"

          echo ""
          echo "✓ Workspace: $WORKSPACE"
          echo "✓ Scheme: $SCHEME"

      # ==========================================
      # BUILD UNSIGNED IOS APP
      # ==========================================
      - name: Compile Unsigned iOS App
        shell: bash
        run: |
          set -o pipefail

          mkdir -p dist

          echo "=========================================="
          echo "Building unsigned iOS application"
          echo "=========================================="

          xcodebuild \
            -workspace "${{ steps.xcode.outputs.workspace }}" \
            -scheme "${{ steps.xcode.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee dist/xcodebuild.log

      # ==========================================
      # PACKAGE APP -> IPA
      # ==========================================
      - name: Package Unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          APP_DIR="ios/build/Build/Products/Release-iphoneos"

          APP_PATH="$(
            find "$APP_DIR" \
              -maxdepth 1 \
              -type d \
              -name '*.app' \
              -print \
              -quit
          )"

          if [[ -z "$APP_PATH" ]]; then
            echo "::error::No Release .app was produced."
            echo ""
            echo "Available files:"
            find ios/build/Build/Products -maxdepth 4 -print || true
            exit 1
          fi

          echo "✓ App found:"
          echo "$APP_PATH"

          rm -rf dist/Payload
          mkdir -p dist/Payload

          cp -R "$APP_PATH" dist/Payload/

          (
            cd dist
            zip -r -q BioStack_PRO_iOS_unsigned.ipa Payload
          )

          rm -rf dist/Payload

          echo ""
          echo "=========================================="
          echo "IPA CREATED"
          echo "=========================================="

          ls -lh dist/BioStack_PRO_iOS_unsigned.ipa

      # ==========================================
      # VERIFY IPA
      # ==========================================
      - name: Verify IPA Artifact
        shell: bash
        run: |
          set -euo pipefail

          test -f dist/BioStack_PRO_iOS_unsigned.ipa || {
            echo "::error::IPA file was not created"
            exit 1
          }

          IPA_SIZE="$(stat -f%z dist/BioStack_PRO_iOS_unsigned.ipa)"

          echo "IPA size: ${IPA_SIZE} bytes"

          if [[ "$IPA_SIZE" -lt 100000 ]]; then
            echo "::error::IPA appears unexpectedly small"
            exit 1
          fi

          echo "✓ IPA artifact looks valid"

      # ==========================================
      # UPLOAD IPA
      # ==========================================
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BioStack-PRO-Sideloadly-${{ github.sha }}
          path: |
            dist/BioStack_PRO_iOS_unsigned.ipa
            dist/xcodebuild.log
          retention-days: 7

      # ==========================================
      # UPLOAD BUILD LOG ON FAILURE
      # ==========================================
      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: BioStack-PRO-build-failure-${{ github.run_id }}
          path: |
            dist/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7

      # ==========================================
      # BUILD SUMMARY
      # ==========================================
      - name: Build Summary
        if: success()
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo "BIOSTACK PRO BUILD SELESAI"
          echo "=========================================="
          echo ""
          echo "IPA:"
          echo "  dist/BioStack_PRO_iOS_unsigned.ipa"
          echo ""
          echo "Build type:"
          echo "  UNSIGNED"
          echo ""
          echo "Next:"
          echo "  Download artifact dari GitHub Actions"
          echo "  lalu masukkan IPA ke Sideloadly."
          echo "=========================================="
