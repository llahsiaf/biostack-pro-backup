<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="X-UA-Compatible"
      content="IE=edge"
    />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1.00001, viewport-fit=cover"
    />

    <meta
      name="theme-color"
      content="#030712"
    />

    <meta
      name="mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <meta
      name="apple-mobile-web-app-title"
      content="BioStack PRO"
    />

    <link
      rel="manifest"
      href="/manifest.json"
    />

    <link
      rel="icon"
      href="/favicon.ico"
    />

    <title>BioStack PRO</title>

    <style id="expo-reset">
      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
        padding: 0;
        -webkit-overflow-scrolling: touch;
      }

      html {
        height: 100%;
        -webkit-text-size-adjust: 100%;
        background: #030712;
      }

      body {
        min-height: 100%;
        overflow-y: auto;
        overscroll-behavior-y: none;
        background: #030712;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      #root {
        min-height: 100vh;
        width: 100%;
        display: flex;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>
      <div
        style="
          font-family: Arial, sans-serif;
          padding: 40px;
          text-align: center;
          color: white;
          background: #030712;
          min-height: 100vh;
          box-sizing: border-box;
        "
      >
        JavaScript is required to use BioStack PRO.
      </div>
    </noscript>

    <div id="root"></div>

    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker
            .register("/sw.js")
            .then(function (registration) {
              console.log(
                "BioStack PRO service worker registered:",
                registration.scope
              );
            })
            .catch(function (error) {
              console.error(
                "BioStack PRO service worker registration failed:",
                error
              );
            });
        });
      }
    </script>
  </body>
</html>
